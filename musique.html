<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎵 Musiques du jeu — La lutte en commun</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(160deg, #0d0d1f, #2b1a4a);
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 { font-size: clamp(20px, 5vw, 32px); margin: 0; }
  .morceaux { display: flex; flex-direction: column; gap: 12px; width: min(420px, 90vw); }
  button {
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
  }
  #btn-sombre { background: linear-gradient(135deg, #34495e, #2c3e50); }
  #btn-bella { background: linear-gradient(135deg, #c0392b, #922b21); }
  #btn-espoir { background: linear-gradient(135deg, #e67e22, #ca6f1e); }
  #btn-zemmour { background: linear-gradient(135deg, #2c3e50, #1a252f); }
  #btn-son { background: rgba(255, 255, 255, 0.15); width: min(420px, 90vw); }
  .actif { outline: 3px solid #ffd23f; }
  a { color: #ffd23f; }
</style>
</head>
<body>
<h1>🎵 Les musiques du jeu</h1>
<div class="morceaux">
  <button id="btn-sombre">🌑 Thème sombre (intro)</button>
  <button id="btn-bella">🎵 Bella Ciao (combat)</button>
  <button id="btn-espoir">🌅 Espoir (arrivée de Mélenchon)</button>
  <button id="btn-zemmour">😬 Motif Zemmour (versus)</button>
</div>
<button id="btn-son">🔊 Son : ON</button>
<p><a href="index.html">← Retour au jeu</a></p>
<script src="js/musique.js"></script>
<script>
  const lecteur = window.createLecteurMusique();
  let courant = null;
  function jouer(nom, btn) {
    lecteur.demarrer(nom);
    courant = nom;
    document.querySelectorAll('.morceaux button').forEach(b => b.classList.remove('actif'));
    btn.classList.add('actif');
  }
  document.getElementById('btn-sombre').addEventListener('click', e => jouer('sombre', e.target));
  document.getElementById('btn-bella').addEventListener('click', e => jouer('bella', e.target));
  document.getElementById('btn-espoir').addEventListener('click', e => jouer('espoir', e.target));
  document.getElementById('btn-zemmour').addEventListener('click', e => jouer('zemmour', e.target));
  document.getElementById('btn-son').addEventListener('click', e => {
    const on = lecteur.basculer();
    e.target.textContent = on ? '🔊 Son : ON' : '🔇 Son : OFF';
  });
</script>
</body>
</html>
